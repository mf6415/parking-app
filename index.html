<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="駐輪場管理">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>駐輪場管理</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f4;
    --text: #1a1d21;
    --text-dim: #626b76;
    --border: #d7dbe2;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --ok: #17803d;
    --ok-bg: #e4f5ea;
    --warn: #b42318;
    --warn-bg: #fdeceb;
    --radius: 14px;
    --tap: 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a;
      --surface: #1d2126;
      --surface-2: #262b31;
      --text: #e9ecef;
      --text-dim: #9aa4b0;
      --border: #333a42;
      --accent: #4c8dff;
      --accent-text: #0b0d10;
      --ok: #5ddb90;
      --ok-bg: #16301f;
      --warn: #ff8d85;
      --warn-bg: #351a18;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a;
    --surface: #1d2126;
    --surface-2: #262b31;
    --text: #e9ecef;
    --text-dim: #9aa4b0;
    --border: #333a42;
    --accent: #4c8dff;
    --accent-text: #0b0d10;
    --ok: #5ddb90;
    --ok-bg: #16301f;
    --warn: #ff8d85;
    --warn-bg: #351a18;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* .btn などの display 指定がブラウザ標準の [hidden] に勝ってしまうため、
     非表示にしたはずのボタンが表示されてしまう。ここで明示的に打ち消す。 */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                 "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }

  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .02em; }
  header .sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

  main { max-width: 820px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 12px; font-size: 15px; font-weight: 700;
    color: var(--text-dim); letter-spacing: .06em;
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat {
    background: var(--surface-2); border-radius: 10px;
    padding: 12px 10px; text-align: center;
  }
  .stat .label { font-size: 12px; color: var(--text-dim); }
  .stat .value {
    font-size: 22px; font-weight: 700; margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .stat.warn .value { color: var(--warn); }
  .stat.ok .value { color: var(--ok); }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 4px; border-bottom: 1px solid var(--border);
    min-height: var(--tap);
  }
  .row:last-child { border-bottom: none; }
  .row .main-col { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; }
  .row .meta {
    font-size: 13px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slot {
    flex-shrink: 0; width: 52px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); border-radius: 8px;
    font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
  }

  .pill {
    flex-shrink: 0; border: none; cursor: pointer;
    min-height: 48px; padding: 0 16px; border-radius: 999px;
    font-size: 15px; font-weight: 700; font-family: inherit;
  }
  .pill.paid { background: var(--ok-bg); color: var(--ok); }
  .pill.unpaid { background: var(--warn-bg); color: var(--warn); }

  button, input, select, textarea { font-family: inherit; font-size: 16px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; min-height: var(--tap); padding: 0 18px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .btn.danger { color: var(--warn); border-color: var(--warn); background: transparent; }
  .btn.block { width: 100%; }
  .btn:active { opacity: .7; }

  label.field { display: block; margin-bottom: 14px; }
  label.field .lab {
    display: block; font-size: 13px; color: var(--text-dim);
    margin-bottom: 5px; font-weight: 600;
  }
  label.field input, label.field select, label.field textarea {
    width: 100%; min-width: 0; max-width: 100%;
    min-height: var(--tap);
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg); color: var(--text);
    font-size: 16px; /* iOSで入力時に画面が拡大するのを防ぐ */
  }
  /* 日付と時刻の入力欄は、見た目をリセットするとiOSで表示が崩れるので除く */
  label.field input:not([type="date"]):not([type="time"]),
  label.field select, label.field textarea {
    -webkit-appearance: none; appearance: none;
  }
  label.field input[type="date"], label.field input[type="time"] {
    line-height: 1.4; text-align: left;
  }
  label.field select {
    /* 端末標準の下向き矢印が消えるので、自前で描く */
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                      linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 18px center, right 13px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 34px;
  }
  label.field textarea { min-height: 76px; resize: vertical; }

  /* 2つの入力を横に並べる行。
     min-width:0 が無いと、時刻入力が自分の幅を主張して隣と重なる。 */
  .field-row { display: flex; gap: 10px; }
  .field-row > label.field { flex: 1 1 0; min-width: 0; }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    flex: 1; min-width: 0; border: none; background: none; cursor: pointer;
    padding: 8px 2px 10px; color: var(--text-dim);
    font-size: 12px; font-weight: 600; white-space: nowrap;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.tabs button.active { color: var(--accent); }
  nav.tabs button svg { width: 22px; height: 22px; flex-shrink: 0; }

  dialog {
    border: none; border-radius: 16px; padding: 0;
    background: var(--surface); color: var(--text);
    width: min(520px, calc(100vw - 32px)); max-height: 88vh;
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }

  /* 中身が長いときは本文だけがスクロールし、
     見出しと操作ボタンは常に見えるようにする */
  dialog > form, dialog > .dlg-wrap {
    display: flex; flex-direction: column; max-height: 88vh;
  }
  .dlg-head {
    flex: 0 0 auto;
    padding: 16px; border-bottom: 1px solid var(--border);
    font-weight: 700; background: var(--surface);
  }
  .dlg-body { flex: 1 1 auto; min-height: 0; padding: 16px; overflow-y: auto; }
  .dlg-foot {
    flex: 0 0 auto;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    display: flex; gap: 10px; background: var(--surface);
  }
  .dlg-foot .btn { flex: 1; }

  .empty { text-align: center; color: var(--text-dim); padding: 28px 12px; font-size: 14px; }

  .month-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .month-bar .btn { min-width: 52px; padding: 0 10px; }
  .month-bar .m {
    flex: 1; text-align: center; font-weight: 700; font-size: 17px;
    font-variant-numeric: tabular-nums;
  }

  .hint { font-size: 13px; color: var(--text-dim); margin: 6px 0 0; }

  /* 新しい版が届いたときの帯。タブバーの上に出す。 */
  #updateBar {
    position: fixed; z-index: 40;
    left: 12px; right: 12px;
    bottom: calc(84px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px 10px 16px;
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
    font-size: 14px; font-weight: 600;
  }
  #updateBar span { flex: 1; }
  /* 解約済みや出庫済みの行。
     opacity で薄くすると文字が読めなくなるため、色だけ落とす。 */
  .inactive .name { color: var(--text-dim); font-weight: 600; }
  .inactive .slot { opacity: .6; }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">今月の状況</h1>
  <div class="sub" id="pageSub"></div>
</header>

<main>
  <section id="view-home"></section>
  <section id="view-list" hidden></section>
  <section id="view-pay" hidden></section>
  <section id="view-temp" hidden></section>
  <section id="view-sales" hidden></section>
  <section id="view-settings" hidden></section>
</main>

<nav class="tabs">
  <button data-tab="home" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    ホーム
  </button>
  <button data-tab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    契約者
  </button>
  <button data-tab="pay">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg>
    入金
  </button>
  <button data-tab="temp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    一時
  </button>
  <button data-tab="sales">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V10M10 19.5V5M16 19.5v-6.5M21 19.5H3"/></svg>
    売上
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    設定
  </button>
</nav>

<!-- 契約者の追加・編集ダイアログ -->
<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <div class="dlg-head" id="editTitle">契約者を追加</div>
    <div class="dlg-body">
      <label class="field">
        <span class="lab">お名前 <span style="color:var(--warn)">*</span></span>
        <input name="name" required placeholder="例: 山田 太郎">
      </label>
      <label class="field">
        <span class="lab">区画番号</span>
        <input name="slot" inputmode="numeric" placeholder="例: 12">
      </label>
      <label class="field">
        <span class="lab">区分</span>
        <select name="plan">
          <option value="worker">社会人</option>
          <option value="student">学生</option>
        </select>
      </label>
      <label class="field">
        <span class="lab">月額料金(円) — 空欄なら区分の料金が使われます</span>
        <input name="fee" type="number" inputmode="numeric" min="0" step="100" id="feeInput">
      </label>
      <label class="field">
        <span class="lab">電話番号</span>
        <input name="phone" type="tel" inputmode="tel" placeholder="例: 090-1234-5678">
      </label>
      <label class="field">
        <span class="lab">契約開始日</span>
        <input name="start" type="date">
      </label>
      <label class="field">
        <span class="lab">車種・メモ</span>
        <textarea name="note" placeholder="例: 電動アシスト、青色"></textarea>
      </label>
      <label class="field">
        <span class="lab">契約状態</span>
        <select name="active">
          <option value="1">契約中</option>
          <option value="0">解約済み</option>
        </select>
      </label>
      <button type="button" class="btn danger block" id="deleteBtn" hidden>この契約者を削除</button>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="cancelBtn">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<!-- まとめて追加ダイアログ -->
<dialog id="bulkDlg">
 <div class="dlg-wrap">
  <div class="dlg-head">契約者をまとめて追加</div>
  <div class="dlg-body">
    <p class="hint" style="margin:0 0 12px">
      1行に1人ずつ、<b>区画番号, お名前, 月額, 電話番号</b> の順に入力します。
      お名前だけでも構いません。Excelからコピーしたものをそのまま貼り付けられます。
    </p>
    <label class="field">
      <span class="lab">貼り付け欄</span>
      <textarea id="bulkText" style="min-height:150px" placeholder="1, 山田 太郎, 1500, 090-1234-5678
2, 鈴木 花子, 1500
3, 佐藤 次郎"></textarea>
    </label>
    <button class="btn block" id="bulkFileBtn" style="margin-bottom:12px">CSVファイルを選ぶ</button>
    <input type="file" id="bulkFile" accept=".csv,.txt,text/csv,text/plain" hidden>
    <button class="btn primary block" id="bulkPreviewBtn">内容を確認する</button>
    <div id="bulkPreview"></div>
  </div>
  <div class="dlg-foot">
    <button type="button" class="btn" id="bulkCancel">キャンセル</button>
    <button type="button" class="btn primary" id="bulkCommit" disabled>追加する</button>
  </div>
 </div>
</dialog>

<!-- 一時利用の受付・修正ダイアログ -->
<dialog id="tempDlg">
  <form method="dialog" id="tempForm">
    <div class="dlg-head" id="tempTitle">一時利用の受付</div>
    <div class="dlg-body">
      <div class="field-row">
        <label class="field">
          <span class="lab">車体の色</span>
          <select name="color" id="tempColor"></select>
        </label>
        <label class="field">
          <span class="lab">カゴ</span>
          <select name="basket"></select>
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span class="lab">年代</span>
          <select name="age"></select>
        </label>
        <label class="field">
          <span class="lab">性別</span>
          <select name="gender"></select>
        </label>
      </div>
      <label class="field">
        <span class="lab">その他のメモ</span>
        <input name="note" placeholder="例: カゴに青い袋">
      </label>
      <div class="field-row">
        <label class="field">
          <span class="lab">入庫日</span>
          <input name="date" type="date">
        </label>
        <label class="field">
          <span class="lab">入庫時刻</span>
          <input name="inAt" type="time">
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span class="lab">出庫日</span>
          <input name="outDate" type="date">
        </label>
        <label class="field">
          <span class="lab">出庫時刻</span>
          <input name="outAt" type="time">
        </label>
      </div>
      <label class="field">
        <span class="lab">料金(円)</span>
        <input name="fee" type="number" inputmode="numeric" min="0" step="10">
      </label>
      <p class="hint" id="tempStayHint" style="margin:-8px 0 14px"></p>
      <button type="button" class="btn danger block" id="tempDelete" hidden>この記録を削除</button>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="tempCancel">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<script>
"use strict";

/* ===== データの保存先 =====
   iPad/iPhone本体のブラウザ内(localStorage)に保存します。
   外部サーバーには一切送信されません。
   端末を変えるとデータは移らないので、設定タブのバックアップを使ってください。 */
const STORE_KEY = "parking.v1";

/* アプリの版。sw.js の VERSION と揃えて増やすこと。
   設定画面に表示して、更新が届いているか確認できるようにしている。 */
const APP_VERSION = "v1";

/* siteName(駐輪場の名前)は、この端末の中だけに保存されます。
   場所が特定されないよう、プログラム側には一切書き込みません。 */
const DEFAULT_RATES = { student: 2000, worker: 2500, daily: 100 };

/* 一時利用で記録する特徴の選択肢。
   どれも未選択のままにできる(分からない場合や、聞けなかった場合のため)。
   load() より先に読み込む必要があるため、ここに置いている。 */
const TEMP_FIELDS = {
  color:  { label: "色",   options: ["シルバー", "ピンク", "黒", "茶色", "緑", "黄緑", "水色", "紫", "その他"] },
  basket: { label: "カゴ", options: ["あり(前)", "あり(後)", "あり(前後)", "なし"] },
  age:    { label: "年代", options: ["30代", "40代", "50代", "60代", "70代", "80代"] },
  gender: { label: "性別", options: ["男", "女"] },
};

/* 古い書き方で保存された値を、今の選択肢に読み替える。
   「前後」は「あり(前後)」、単なる「あり」は「あり(前)」として扱う。 */
const TEMP_ALIAS = { basket: { "前後": "あり(前後)", "あり": "あり(前)" } };

function normalizeTemp(t) {
  Object.keys(TEMP_ALIAS).forEach(key => {
    const map = TEMP_ALIAS[key];
    if (t && t[key] && map[t[key]]) t[key] = map[t[key]];
  });
  return t;
}

function freshData() {
  return {
    contracts: [],
    payments: {},
    temps: [],
    rates: Object.assign({}, DEFAULT_RATES),
    siteName: "",
    lastBackup: "",
  };
}

/* 保存されたデータを、今のバージョンが扱える形に整える。
   起動時の読み込みと、バックアップからの復元の両方でこれを通す。
   復元側でこれを忘れると、古いバックアップの料金が変わってしまう。 */
function normalizeData(parsed) {
  if (!parsed || typeof parsed !== "object") return freshData();
  {
    const contracts = Array.isArray(parsed.contracts) ? parsed.contracts : [];

    const rates = Object.assign({}, DEFAULT_RATES);
    if (parsed.rates && typeof parsed.rates === "object") {
      ["student", "worker", "daily"].forEach(k => {
        if (Number.isFinite(parsed.rates[k])) rates[k] = parsed.rates[k];
      });
    } else if (Number.isFinite(parsed.defaultFee)) {
      /* 旧バージョンからの移行。
         以前は全員が defaultFee だったので、金額が変わらないよう
         個別料金として各契約者に書き込んでおく。 */
      contracts.forEach(c => {
        if (c.fee === "" || c.fee == null) c.fee = parsed.defaultFee;
      });
    }

    return {
      contracts,
      payments: (parsed.payments && typeof parsed.payments === "object") ? parsed.payments : {},
      temps: (Array.isArray(parsed.temps) ? parsed.temps : []).map(normalizeTemp),
      rates,
      siteName: typeof parsed.siteName === "string" ? parsed.siteName : "",
      lastBackup: typeof parsed.lastBackup === "string" ? parsed.lastBackup : "",
    };
  }
}

/* 読み込みに失敗したかどうか。失敗時は起動直後に知らせる。 */
let loadFailed = false;

function load() {
  const raw = localStorage.getItem(STORE_KEY);
  if (!raw) return freshData();
  try {
    return normalizeData(JSON.parse(raw));
  } catch (e) {
    /* 壊れた中身をそのまま捨てると復旧できなくなるので、別の場所へ退避する。
       この後に空データで保存すると元データが消えるため、利用者に知らせる。 */
    loadFailed = true;
    try { localStorage.setItem(STORE_KEY + ".broken", raw); } catch (e2) {}
    console.warn("保存データを読めませんでした", e);
    return freshData();
  }
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch (e) {
    const quota = e && (e.name === "QuotaExceededError"
                        || e.name === "NS_ERROR_DOM_QUOTA_REACHED" || e.code === 22);
    alert(quota
      ? "保存できません。端末の空き容量が足りていません。\n"
        + "写真などを整理してから、もう一度お試しください。\n"
        + "このままだと入力した内容が残りません。"
      : "保存に失敗しました。\n"
        + "Safariのプライベートブラウズを使っている場合は解除してください。\n"
        + "このままだと入力した内容が残りません。");
  }
}

    alert("保存されていたデータを読み取れませんでした。\n\n"

      + "新しく入力する前に、設定タブの「バックアップから復元する」で\n"
      + "控えのファイルを読み込んでください。");

}

/* ===== 便利関数 ===== */
const yen = n => "¥" + (Number(n) || 0).toLocaleString("ja-JP");
const $ = sel => document.querySelector(sel);

function monthKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function monthLabel(key) {
  const [y, m] = key.split("-");
  return `${y}年 ${Number(m)}月`;
}
function shiftMonth(key, delta) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKey(d);
}
function payKey(contractId, mKey) { return contractId + "@" + mKey; }
function isPaid(contractId, mKey) { return Boolean(data.payments[payKey(contractId, mKey)]); }

/* 区画番号の並び順。数字は小さい順、番号なしや文字の区画は最後に回す。
   Number("0") は偽と判定されるため、|| は使えない。 */
function slotOrder(c) {
  const n = Number(c.slot);
  return (c.slot !== "" && c.slot != null && Number.isFinite(n)) ? n : Infinity;
}

function activeContracts() {
  return data.contracts
    .filter(c => c.active !== false)
    .sort((a, b) => slotOrder(a) - slotOrder(b));
}

/* ===== 料金の計算 =====
   契約期間は「1日〜月末まで」。
   月の途中から契約した場合は、その月だけ日割りにする。
   日割り = 当月停める日数 × 日額。ただし月額を超えないよう頭打ちにする。 */

const PLAN_LABEL = { student: "学生", worker: "社会人" };

function planOf(c) { return c.plan === "student" ? "student" : "worker"; }

/* その契約者の月額。個別料金が入っていればそれを優先する */
function feeOf(c) {
  if (c.fee !== "" && c.fee != null && Number.isFinite(Number(c.fee))) return Number(c.fee);
  return data.rates[planOf(c)];
}

function daysInMonth(mKey) {
  const [y, m] = mKey.split("-").map(Number);
  return new Date(y, m, 0).getDate();
}

/* 契約開始日が属する月かどうか */
function isStartMonth(c, mKey) {
  return Boolean(c.start) && c.start.slice(0, 7) === mKey;
}

/* その月に契約が始まっているか。
   開始日より前の月は請求対象にしない(未来の契約者に過去分を請求しないため)。 */
function isActiveIn(c, mKey) {
  if (!c.start) return true;              // 開始日が未入力なら常に対象
  return mKey >= c.start.slice(0, 7);
}

/* その月に請求対象となる契約者 */
function contractsFor(mKey) {
  return activeContracts().filter(c => isActiveIn(c, mKey));
}

/* mKey の月に、その契約者が実際に停める日数 */
function daysUsedIn(c, mKey) {
  const total = daysInMonth(mKey);
  if (!isStartMonth(c, mKey)) return total;
  const startDay = Number(c.start.slice(8, 10));
  /* 日付が壊れている場合(例: 2026-09-99)は満額として扱う。
     0円で請求し損ねるより安全なため。 */
  if (!Number.isFinite(startDay) || startDay < 1 || startDay > total) return total;
  return Math.max(1, total - startDay + 1);
}

/* mKey の月の請求額と、その内訳を返す */
function chargeFor(c, mKey) {
  const monthly = feeOf(c);
  if (!isActiveIn(c, mKey)) {
    return { amount: 0, prorated: false, days: 0, capped: false, notYet: true };
  }
  if (!isStartMonth(c, mKey)) {
    return { amount: monthly, prorated: false, days: daysInMonth(mKey), capped: false };
  }
  const days = daysUsedIn(c, mKey);
  const raw = days * data.rates.daily;
  const capped = raw > monthly;
  return { amount: Math.min(raw, monthly), prorated: true, days, capped, raw };
}

/* 画面に出す金額。
   入金済みならその時に実際に受け取った額を使う。
   こうしないと、後から料金設定を変えたときに過去の表示額が動いてしまい、
   売上タブやCSVの金額と食い違う。 */
function shownAmount(c, mKey) {
  const p = data.payments[payKey(c.id, mKey)];
  if (p && Number.isFinite(Number(p.amount))) {
    return {
      amount: Number(p.amount),
      prorated: Boolean(p.prorated),
      days: Number(p.days) || 0,
      capped: false,
      recorded: true,
    };
  }
  return chargeFor(c, mKey);
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

/* 入金の記録と取り消し。
   取り消しは受領額ごと消える操作なので、必ず確認を取る。
   取り消した後に押し直すと、その時点の料金設定で記録し直される点にも注意。 */
function togglePay(contractId, mKey) {
  const k = payKey(contractId, mKey);
  if (data.payments[k]) {
    const c = data.contracts.find(x => x.id === contractId);
    const amt = yen(data.payments[k].amount);
    if (!confirm(`${c ? c.name + "さん" : ""}の${monthLabel(mKey)}分 ${amt} の入金記録を取り消します。\n`
                 + `よろしいですか?`)) return;
    delete data.payments[k];
  } else {
    const c = data.contracts.find(x => x.id === contractId);
    const ch = c ? chargeFor(c, mKey) : { amount: 0, prorated: false, days: 0 };
    data.payments[k] = {
      at: new Date().toISOString(),
      amount: ch.amount,
      prorated: ch.prorated,
      days: ch.days,
    };
  }
  save();
}

/* ===== 一時利用の画面 ===== */
let tempDate = todayKey();

function renderTemp() {
  const arrivals = arrivalsOn(tempDate);
  const carried = carriedOverOn(tempDate);
  const list = carried.concat(arrivals);
  /* その日にまだ出庫していない台数(持ち越し分も含む) */

  const total = arrivals.reduce((s, t) => s + (Number(t.fee) || 0), 0);

  const rowHtml = (t) => {
    const isCarried = t.date !== tempDate;
    const outToday = t.outAt && (t.outDate || t.date) === tempDate;
    const done = t.outAt && (t.outDate || t.date) <= tempDate;
    return `
      <div class="row ${done ? "inactive" : ""}" data-edit-temp="${escapeHtml(t.id)}"
           style="cursor:pointer">

          <div class="name">${escapeHtml(tempSummary(t) || "(特徴の記入なし)")}</div>
          <div class="meta">
            ${isCarried
              ? `${escapeHtml(dateLabel(t.date))}から預かり中 (${stayDays(t, tempDate)}日目)`
              : escapeHtml(yen(t.fee))}
            ${outToday ? " ・ " + escapeHtml(t.outAt) + " 出庫"

      </div>`;

  $("#view-temp").innerHTML = `

      <button class="btn" id="prevD" aria-label="前の日">‹</button>

      <button class="btn" id="nextD" aria-label="次の日">›</button>

    </button>

    <div class="card">
      <h2>この日の集計</h2>
      <div class="stats">
        <div class="stat"><div class="label">受付</div><div class="value">${arrivals.length}</div></div>
        <div class="stat warn"><div class="label">未出庫</div><div class="value">${inNow.length}</div></div>
        <div class="stat ok"><div class="label">売上</div><div class="value">${escapeHtml(yen(total))}</div></div>
      </div>
      ${carried.length === 0 ? "" :
        `<p class="hint">前の日から${carried.length}台を預かっています。売上は受付した日に計上済みです。</p>`}
    </div>

    ${carried.length === 0 ? "" : `
    <div class="card" style="border-color:var(--warn)">
      <h2 style="color:var(--warn)">前の日から預かり中 (${carried.length}台)</h2>
      ${carried.map(rowHtml).join("")}
    </div>`}

    <div class="card">

      ${arrivals.length === 0
        ? `<div class="empty">この日の一時利用はまだありません。</div>`
        : arrivals.map(rowHtml).join("")}

      ev.stopPropagation();
      const t = data.temps.find(x => x.id === btn.dataset.out);
      if (!t) return;

      if (t.outAt) {
        /* 出庫済みを取り消す。記録した時刻が消えるので確認を取る。 */
        if (!confirm(`${escapeHtml(t.outAt)}の出庫記録を取り消します。よろしいですか?`)) return;
        t.outAt = ""; t.outDate = "";
        /* 日数分に書き換えた料金があれば、元の金額に戻す */
        if (t.feeBeforeStay != null) { t.fee = t.feeBeforeStay; delete t.feeBeforeStay; }
      } else {
        t.outAt = nowTime();
        t.outDate = tempDate;
        const days = totalStayDays(t);
        if (days > 1) {
          const suggested = days * data.rates.daily;
          if (Number(t.fee) !== suggested &&
              confirm(`${days}日間の預かりです。\n料金を${yen(suggested)}(${days}日分)に変更しますか?\n`

    row.addEventListener("click", () => openTemp(row.dataset.editTemp));
  });
}

function shiftDate(key, delta) {
  const [y, m, d] = key.split("-").map(Number);
  return todayKey(new Date(y, m - 1, d + delta));
}

let editingTempId = null;

/* 選択肢を組み立てる。先頭は「未選択」の空欄。
   既存の記録が選択肢に無い値を持っている場合は、その値も選択肢に足す。
   こうしないと、編集して保存した瞬間にその値が消えてしまう。 */
function buildTempSelects(t) {
  const f = $("#tempForm");
  Object.keys(TEMP_FIELDS).forEach(key => {
    const sel = f[key];
    if (!sel) return;
    const opts = TEMP_FIELDS[key].options.slice();
    const cur = t && t[key];
    if (cur && opts.indexOf(cur) < 0) opts.push(cur);
    sel.innerHTML = '<option value="">未選択</option>'
      + opts.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
  });
}

function openTemp(id) {
  editingTempId = id;
  const f = $("#tempForm");
  const t = id ? data.temps.find(x => x.id === id) : null;
  buildTempSelects(t);

  $("#tempTitle").textContent = t ? "記録を修正" : "一時利用の受付";
  Object.keys(TEMP_FIELDS).forEach(key => { f[key].value = t ? (t[key] || "") : ""; });
  f.note.value = t ? (t.note || "") : "";
  f.date.value = t ? (t.date || tempDate) : tempDate;
  f.inAt.value = t ? (t.inAt || "") : nowTime();
  f.outDate.value = t ? (t.outDate || "") : "";
  f.outAt.value = t ? (t.outAt || "") : "";
  f.fee.value = t ? (Number(t.fee) || 0) : data.rates.daily;
  $("#tempDelete").hidden = !t;
  updateStayHint();

  /* 自動でフォーカスしない。
     iPadでは選択欄にフォーカスするとホイールが勝手に開き、
     閉じる操作が1つ増えてしまうため。 */
  $("#tempDlg").showModal();
}

/* 入庫日と出庫日から預かり日数を出し、目安の料金を案内する */
function updateStayHint() {
  const f = $("#tempForm");
  const box = $("#tempStayHint");
  if (!box) return;
  const from = f.date.value;
  const to = f.outDate.value || (f.outAt.value ? f.date.value : "");
  if (!from || !to) { box.textContent = ""; return; }
  if (to < from) { box.textContent = "出庫日が入庫日より前になっています。"; return; }
  const days = stayDays({ date: from }, to);
  box.textContent = days <= 1
    ? `預かり1日 (${data.rates.daily}円が目安)`
    : `預かり${days}日 (${days * data.rates.daily}円が目安)`;
}

["date", "outDate", "outAt"].forEach(k => {
  $("#tempForm")[k].addEventListener("change", updateStayHint);
});

$("#tempForm").addEventListener("submit", (ev) => {
  const f = $("#tempForm");
  const rec = {
    note: f.note.value.trim(),
    date: f.date.value || tempDate,
    inAt: f.inAt.value,
    outDate: f.outDate.value,
    outAt: f.outAt.value,
    fee: f.fee.value === "" ? data.rates.daily : Number(f.fee.value),
  };
  /* 出庫時刻だけ入れて日付を忘れた場合は、入庫日に出庫したものとする */
  if (rec.outAt && !rec.outDate) rec.outDate = rec.date;
  /* 出庫日だけ入れて時刻が無い場合は、日付も無効にする(未出庫のまま) */
  if (!rec.outAt) rec.outDate = "";
  /* 出庫が入庫より前だと、集計から消えて見えなくなるので保存させない */
  if (rec.outDate && rec.outDate < rec.date) {
    ev.preventDefault();   // これが無いとダイアログが閉じてしまう
    alert("出庫日が入庫日より前になっています。\n日付を確かめてください。");
    return;
  }
  Object.keys(TEMP_FIELDS).forEach(key => { rec[key] = f[key].value; });
  if (editingTempId) {
    const t = data.temps.find(x => x.id === editingTempId);
    if (t) Object.assign(t, rec);
  } else {
    data.temps.push(Object.assign({
      id: "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    }, rec));
  }
  save();
  setTimeout(renderAll, 0);
});

$("#tempCancel").addEventListener("click", () => $("#tempDlg").close());

$("#tempDelete").addEventListener("click", () => {
  if (!editingTempId) return;
  if (!confirm("この一時利用の記録を削除します。よろしいですか?")) return;
  data.temps = data.temps.filter(x => x.id !== editingTempId);
  save();
  $("#tempDlg").close();
  renderAll();
});

/* ===== 売上の集計と書き出し ===== */
let salesYear = new Date().getFullYear();

/* mKey の月の売上を、月極と一時利用に分けて集計する */
function salesOfMonth(mKey) {
  let monthly = 0, monthlyCount = 0;
  Object.keys(data.payments).forEach(k => {
    if (k.slice(k.indexOf("@") + 1) !== mKey) return;
    monthly += Number(data.payments[k].amount) || 0;
    monthlyCount++;
  });
  const temps = tempsInMonth(mKey);
  const temp = temps.reduce((s, t) => s + (Number(t.fee) || 0), 0);
  return { monthly, monthlyCount, temp, tempCount: temps.length, total: monthly + temp };
}

function renderSales() {
  const months = [];
  for (let m = 1; m <= 12; m++) {
    const mKey = salesYear + "-" + String(m).padStart(2, "0");
    months.push(Object.assign({ mKey, m }, salesOfMonth(mKey)));
  }
  const yearTotal = months.reduce((s, x) => s + x.total, 0);
  const yearMonthly = months.reduce((s, x) => s + x.monthly, 0);
  const yearTemp = months.reduce((s, x) => s + x.temp, 0);

  $("#view-sales").innerHTML = `
    <div class="month-bar">
      <button class="btn" id="prevY" aria-label="前の年">‹</button>
      <div class="m">${salesYear}年</div>
      <button class="btn" id="nextY" aria-label="次の年">›</button>
    </div>

    <div class="card">
      <h2>${salesYear}年の合計</h2>
      <div class="stats">
        <div class="stat"><div class="label">月極</div><div class="value">${escapeHtml(yen(yearMonthly))}</div></div>
        <div class="stat"><div class="label">一時利用</div><div class="value">${escapeHtml(yen(yearTemp))}</div></div>
        <div class="stat ok"><div class="label">総額</div><div class="value">${escapeHtml(yen(yearTotal))}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>月ごとの内訳</h2>
      ${months.map(x => `
        <div class="row ${x.total === 0 ? "inactive" : ""}">
          <div class="slot" style="width:44px">${x.m}月</div>
          <div class="main-col">
            <div class="name">${escapeHtml(yen(x.total))}</div>
            <div class="meta">月極 ${x.monthlyCount}件 ${escapeHtml(yen(x.monthly))} ・ 一時 ${x.tempCount}件 ${escapeHtml(yen(x.temp))}</div>
          </div>
        </div>`).join("")}
    </div>

    <div class="card">
      <h2>確定申告用の書き出し</h2>
      <p class="hint" style="margin:0 0 12px">
        1件ごとの明細をCSVで書き出します。Excelでそのまま開けます。
      </p>
      <button class="btn block" id="csvYear" style="margin-bottom:10px">${salesYear}年の明細を書き出す</button>
      <button class="btn block" id="csvSummary">${salesYear}年の月別集計を書き出す</button>
    </div>`;

  $("#prevY").addEventListener("click", () => { salesYear--; renderSales(); });
  $("#nextY").addEventListener("click", () => { salesYear++; renderSales(); });
  $("#csvYear").addEventListener("click", () => exportDetailCsv(salesYear));
  $("#csvSummary").addEventListener("click", () => exportSummaryCsv(salesYear));
}

/* CSVの1項目を安全な形に整える。
   先頭が = + - @ の値は、Excelが数式として実行してしまう。
   氏名やメモにそういう文字が入っていても害が出ないよう、
   先頭にアポストロフィを足して文字列として扱わせる。 */
function csvCell(v) {
  let s = String(v == null ? "" : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/* ExcelはBOMが無いと日本語を文字化けさせるので先頭に付ける */
function downloadCsv(rows, filename) {
  const body = rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  return deliverFile("﻿" + body, filename, "text/csv;charset=utf-8");
}

function exportDetailCsv(year) {
  const rows = [["日付", "対象月", "区分", "氏名または特徴", "区画", "内訳", "金額",
                 "出庫日", "預かり日数", "色", "カゴ", "年代", "性別", "メモ"]];
  const items = [];

  Object.keys(data.payments).forEach(k => {
    const mKey = k.slice(k.indexOf("@") + 1);
    if (mKey.slice(0, 4) !== String(year)) return;
    const p = data.payments[k];
    const c = data.contracts.find(x => x.id === k.slice(0, k.indexOf("@")));
    /* 実際に受け取った日を日付欄にする(確定申告は現金の動いた日で記録するため)。
       記録が無い古いデータは対象月の月末を使う。 */
    let paidOn = "";
    if (p.at) {
      const d = new Date(p.at);
      if (!isNaN(d.getTime())) paidOn = todayKey(d);
    }
    if (!paidOn) paidOn = mKey + "-" + String(daysInMonth(mKey)).padStart(2, "0");

    items.push({
      /* 並び順は対象月を基準にする。こうすると月別集計のCSVと金額が一致する。 */
      sort: mKey + "-00",
      row: [
        paidOn, mKey, "月極",
        c ? c.name : "(削除済み)",
        c ? (c.slot || "") : "",
        p.prorated ? `日割り ${p.days}日` : "月額",
        Number(p.amount) || 0,
        "", "", "", "", "", "", "",
      ],
    });
  });

  data.temps.forEach(t => {
    if (String(t.date).slice(0, 4) !== String(year)) return;
    items.push({
      sort: t.date + "-" + (t.inAt || ""),
      row: [
        t.date, String(t.date).slice(0, 7), "一時利用",
        tempSummary(t),
        "",
        (t.inAt || "") + (t.outAt ? "〜" + t.outAt : ""),
        Number(t.fee) || 0,
        t.outAt ? (t.outDate || t.date) : "",
        t.outAt ? totalStayDays(t) : "",
        t.color || "", t.basket || "", t.age || "", t.gender || "", t.note || "",
      ],
    });
  });

  items.sort((a, b) => a.sort.localeCompare(b.sort));
  items.forEach(x => rows.push(x.row));

  const total = items.reduce((s, x) => s + (Number(x.row[6]) || 0), 0);
  rows.push([]);
  rows.push(["", "", "", "", "", "合計", total, "", "", "", "", "", "", ""]);

  if (items.length === 0) { alert(`${year}年の記録がありません。`); return; }
  downloadCsv(rows, `売上明細_${year}年.csv`);
}

function exportSummaryCsv(year) {
  const rows = [["月", "月極件数", "月極金額", "一時利用件数", "一時利用金額", "合計"]];
  let t1 = 0, t2 = 0, t3 = 0, t4 = 0;
  for (let m = 1; m <= 12; m++) {
    const s = salesOfMonth(year + "-" + String(m).padStart(2, "0"));
    rows.push([m + "月", s.monthlyCount, s.monthly, s.tempCount, s.temp, s.total]);
    t1 += s.monthlyCount; t2 += s.monthly; t3 += s.tempCount; t4 += s.temp;
  }
  if (t2 + t4 === 0) { alert(`${year}年の記録がありません。`); return; }
  rows.push(["合計", t1, t2, t3, t4, t2 + t4]);
  downloadCsv(rows, `売上集計_${year}年.csv`);
}

/* ===== バックアップ =====
   iPadでは共有メニューを開き、そこからGoogleドライブを選べるようにする。
   共有に対応していないパソコンのブラウザでは、通常のダウンロードにする。 */

function backupFileName() {
  return `駐輪場バックアップ_${todayKey()}.json`;
}

function daysSinceBackup() {
  if (!data.lastBackup) return null;
  const then = new Date(data.lastBackup);
  if (isNaN(then.getTime())) return null;
  return Math.floor((Date.now() - then.getTime()) / 86400000);
}

/* 端末のデータはiOSの都合で消えることがあるので、催促は短めにする。
   記録が1件も無いうちは催促しない。 */
function backupOverdue() {
  if (data.contracts.length === 0 && data.temps.length === 0) return false;
  const d = daysSinceBackup();
  return d === null || d >= 14;
}

function backupStatusText() {
  const d = daysSinceBackup();
  if (d === null) return "まだ一度もバックアップしていません。";
  if (d === 0) return "前回のバックアップ: 今日";
  if (d >= 30) return `前回のバックアップから${d}日経っています。`;
  return `前回のバックアップ: ${d}日前`;
}

function markBackedUp() {
  data.lastBackup = new Date().toISOString();
  save();
}

/* ファイルを1つ端末に渡す。
   iPadのSafariは a.download をほぼ無視するので、まず共有メニューを試す。
   共有が使えない環境(パソコンのブラウザ)だけ、従来のダウンロードにする。
   戻り値: 共有をキャンセルされた場合は false。 */
async function deliverFile(text, name, mime) {
  try {
    if (typeof File === "function" && navigator.share && navigator.canShare) {
      const file = new File([text], name, { type: mime });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        return true;
      }
    }
  } catch (e) {
    if (e && e.name === "AbortError") return false;   // 利用者が閉じた
    /* それ以外は共有が使えないだけなので、下のダウンロードへ進む */
  }

  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.style.display = "none";
  document.body.appendChild(a);   // 一部のブラウザはDOMに無いと動かない
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    if (a.parentNode) a.parentNode.removeChild(a);
  }, 60000);                      // 大きいファイルでも取りこぼさないよう長めに待つ
  return true;
}

async function doBackup(silent) {
  const ok = await deliverFile(
    JSON.stringify(data, null, 2), backupFileName(), "application/json");
  if (!ok) return false;
  if (!silent) { markBackedUp(); renderAll(); }
  return true;
}

        「停める日数 × 1日あたりの料金」で計算し、月額を超えるときは月額で止めます。

    <div class="card" ${backupOverdue() ? 'style="border-color:var(--warn)"' : ""}>

        月に1度はGoogleドライブに保存してください。
      </p>
      <button class="btn primary block" id="exportBtn" style="margin-bottom:10px">
        バックアップを保存する
      </button>
      <button class="btn block" id="importBtn">バックアップから復元する</button>

    </div>

    <div class="card">
      <h2>この端末のデータ</h2>
      <p class="hint">
        契約者 ${data.contracts.length}件 / 入金記録 ${Object.keys(data.payments).length}件

      </p>
    </div>

    <div class="card">
      <h2>アプリの状態</h2>
      <p class="hint">

  /* オフラインで使える状態になっているかを表示する */
  (function showSwState() {

    if (!box) return;
    if (!("serviceWorker" in navigator) || location.protocol.indexOf("http") !== 0) {
      box.textContent = "この開き方では使えません";
      return;
    }
    navigator.serviceWorker.getRegistration()
      .then((reg) => {
        box.textContent = (reg && navigator.serviceWorker.controller)
          ? "使えます(電波が無くても起動します)"
          : "準備中。一度アプリを開き直してください";
      })
      .catch(() => { box.textContent = "確認できませんでした"; });

      worker: Number($("#rateWorker").value),
      daily: Number($("#rateDaily").value),
    };
    const bad = Object.keys(vals).some(k => !Number.isFinite(vals[k]) || vals[k] < 0);
    if (bad) { alert("正しい金額を入力してください。"); return; }
    data.rates = vals; save(); renderAll();

      if (!Array.isArray(parsed.contracts)) throw new Error("形式が違います");

      /* 中身を具体的に見せてから確認する。
         「空のバックアップで全部消える」事故を防ぐため、件数を必ず並べて出す。 */
      const inFile = {
        c: parsed.contracts.length,
        p: Object.keys(parsed.payments || {}).length,
        t: Array.isArray(parsed.temps) ? parsed.temps.length : 0,
      };
      const nowHas = {
        c: data.contracts.length,
        p: Object.keys(data.payments).length,
        t: data.temps.length,
      };
      const shrinking = inFile.c < nowHas.c || inFile.p < nowHas.p || inFile.t < nowHas.t;

      if (!confirm(
        `復元するとこうなります。\n\n`
        + `　　　　　　今      →   復元後\n`
        + `契約者　　 ${nowHas.c}件    →   ${inFile.c}件\n`
        + `入金記録　 ${nowHas.p}件    →   ${inFile.p}件\n`
        + `一時利用　 ${nowHas.t}件    →   ${inFile.t}件\n\n`
        + (shrinking ? "※ 件数が減ります。古い控えを選んでいませんか?\n\n" : "")
        + `今のデータは、この後すぐ控えとして書き出します。\n続けますか?`)) return;

      /* 上書きする前に、今のデータを必ず1部書き出しておく */
      if (nowHas.c > 0 || nowHas.t > 0) await doBackup(true);

      data = normalizeData(parsed);
      save(); renderAll();
      alert("復元しました。");
    } catch (e) {
      alert("このファイルは読み込めませんでした。\n"
        + "バックアップで書き出した .json ファイルを選んでください。");
    } finally {
      ev.target.value = "";
    }
  });
}

/* ===== 追加・編集ダイアログ ===== */
let editingId = null;

function openEdit(id) {
  editingId = id;
  const form = $("#editForm");
  const c = id ? data.contracts.find(x => x.id === id) : null;

  $("#editTitle").textContent = c ? "契約者を編集" : "契約者を追加";
  form.name.value = c ? (c.name || "") : "";
  form.slot.value = c ? (c.slot || "") : "";
  form.plan.value = c ? planOf(c) : "worker";
  form.fee.value = c && c.fee !== "" && c.fee != null ? c.fee : "";
  syncFeePlaceholder();
  form.phone.value = c ? (c.phone || "") : "";
  form.start.value = c ? (c.start || "") : "";
  form.note.value = c ? (c.note || "") : "";
  form.active.value = c && c.active === false ? "0" : "1";
  $("#deleteBtn").hidden = !c;

  $("#editDlg").showModal();
}

/* 区分を選んだら、その区分の標準額を薄い文字で見せる */
function syncFeePlaceholder() {
  const form = $("#editForm");
  const plan = form.plan.value === "student" ? "student" : "worker";
  $("#feeInput").placeholder = `${PLAN_LABEL[plan]}の標準額 ${data.rates[plan]}`;
}

$("#editForm").plan.addEventListener("change", syncFeePlaceholder);

$("#editForm").addEventListener("submit", (ev) => {
  const form = ev.target;
  const rec = {
    id: editingId || ("c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
    name: form.name.value.trim(),
    slot: form.slot.value.trim(),
    plan: form.plan.value === "student" ? "student" : "worker",
    fee: form.fee.value === "" ? "" : Number(form.fee.value),
    phone: form.phone.value.trim(),
    start: form.start.value,
    note: form.note.value.trim(),
    active: form.active.value === "1",
  };
  if (!rec.name) { ev.preventDefault(); alert("お名前を入力してください。"); return; }

  const idx = data.contracts.findIndex(x => x.id === rec.id);
  if (idx >= 0) data.contracts[idx] = rec; else data.contracts.push(rec);
  save();
  setTimeout(renderAll, 0);
});

$("#cancelBtn").addEventListener("click", () => $("#editDlg").close());

$("#deleteBtn").addEventListener("click", () => {
  if (!editingId) return;
  const c = data.contracts.find(x => x.id === editingId);
  const paidCount = Object.keys(data.payments)
    .filter(k => k.indexOf(editingId + "@") === 0).length;

  /* 入金記録は消さない。消すと過去の売上と確定申告の数字が変わってしまう。
     「もう契約していない」という意味なら、削除ではなく解約済みにしてもらう。 */
  const msg = paidCount > 0
    ? `「${c ? c.name : ""}」さんを一覧から削除します。\n`
      + `これまでの入金 ${paidCount}件の記録は、売上の集計に必要なため残します。\n\n`
      + `※まだ契約が続いている方なら、削除ではなく「契約状態」を\n`
      + `　解約済みに変える方をおすすめします。\n\n削除しますか?`
    : `「${c ? c.name : ""}」さんを削除します。よろしいですか?`;
  if (!confirm(msg)) return;

  data.contracts = data.contracts.filter(x => x.id !== editingId);
  save();
  $("#editDlg").close();
  renderAll();
});

/* ===== 一時利用(日払い) =====
   1件ごとに、日付・入庫時刻・出庫時刻・車体の特徴・料金を記録する。 */

function todayKey(d) {
  const t = d || new Date();
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0")
         + "-" + String(t.getDate()).padStart(2, "0");
}
function nowTime() {
  const t = new Date();
  return String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
}
function dateLabel(key) {
  const [y, m, d] = key.split("-").map(Number);
  const w = "日月火水木金土"[new Date(y, m - 1, d).getDay()];
  return `${m}月${d}日(${w})`;
}

/* 一時利用で記録する特徴の選択肢。
   どれも未選択のままにできる(分からない場合や、聞けなかった場合のため)。 */
/* 一覧に出す「黒・カゴあり(前)・40代・男」のような1行の要約 */
function tempSummary(t) {
  const parts = [];
  if (t.color) parts.push(t.color);
  if (t.basket) parts.push("カゴ" + t.basket);
  if (t.age) parts.push(t.age);
  if (t.gender) parts.push(t.gender);
  if (t.note) parts.push(t.note);
  return parts.join("・");
}

/* その自転車が、指定した日に駐輪場に「居た」かどうか。
   1日を超えて預かることがあるため、受付日だけで判断しない。 */
function isPresentOn(t, dateKey) {
  if (!t.date || t.date > dateKey) return false;   // まだ受け付けていない
  if (!t.outAt) return true;                        // 未出庫ならずっと居る
  const out = t.outDate || t.date;                  // 古い記録は受付日に出庫した扱い
  return out >= dateKey;
}

/* 受付日から指定日までの預かり日数(受付日を1日目とする) */
function stayDays(t, dateKey) {
  if (!t.date) return 1;
  const [y1, m1, d1] = t.date.split("-").map(Number);
  const [y2, m2, d2] = dateKey.split("-").map(Number);
  const diff = Math.round(
    (new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000
  );
  return Math.max(1, diff + 1);
}

/* 出庫までにかかった日数。未出庫なら今日までの日数。 */
function totalStayDays(t) {
  return stayDays(t, t.outAt ? (t.outDate || t.date) : todayKey());
}

/* その日に受け付けた分 */
function arrivalsOn(dateKey) {
  return data.temps
    .filter(t => t.date === dateKey)
    .sort((a, b) => String(b.inAt).localeCompare(String(a.inAt)));
}

/* 前の日から続けて預かっている分 */
function carriedOverOn(dateKey) {
  return data.temps
    .filter(t => t.date !== dateKey && isPresentOn(t, dateKey))
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
}

/* その日に関係する記録すべて(受付分＋持ち越し分) */
function tempsOnDate(dateKey) {
  return carriedOverOn(dateKey).concat(arrivalsOn(dateKey));
}
function tempsInMonth(mKey) {
  return data.temps.filter(t => String(t.date).slice(0, 7) === mKey);
}

/* ===== まとめて追加 ===== */

/* 1行を項目に分割する。タブ区切り(Excelからの貼り付け)と
   カンマ区切り(CSV)の両方に対応し、"..." で囲まれた項目も扱う。 */
function splitLine(line) {
  // 区切り文字を判定する。全角カンマ(，)で入力されることもある。
  let sep = ",";
  if (line.indexOf("\t") >= 0) sep = "\t";
  else if (line.indexOf(",") >= 0) sep = ",";
  else if (line.indexOf("，") >= 0) sep = "，";
  const out = [];
  let cur = "", inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuote) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuote = false;
      } else cur += ch;
    } else if (ch === '"') {
      inQuote = true;
    } else if (ch === sep) {
      out.push(cur); cur = "";
    } else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

/* 全角の数字や記号を半角に直す(手入力のゆらぎ対策) */
function toHalfWidth(s) {
  return String(s)
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[－ー−]/g, "-")
    .replace(/[，]/g, ",")
    .replace(/\s+/g, " ")
    .trim();
}

/* 電話番号らしき文字列かどうか。
   金額の列を省いて電話番号だけ書かれた名簿で、
   電話番号を金額と取り違えないために使う。 */
function looksLikePhone(s) {
  const t = toHalfWidth(s);
  const digits = t.replace(/[^\d]/g, "");
  if (digits.length >= 10) return true;
  return t.indexOf("-") >= 0 && digits.length >= 9;
}

function parseBulk(text) {
  const rows = [];
  const errors = [];
  const lines = text.split(/\r?\n/);

  lines.forEach((line, i) => {
    if (!line.trim()) return;
    let cells = splitLine(line);

    // 見出し行(1行目に「名前」「氏名」などが入っている)は読み飛ばす
    if (i === 0 && cells.some(c => /名前|氏名|区画|番号|月額|料金|電話|区分/.test(c))) return;

    /* 「学生」「社会人」だけが入った列を先に取り出して除く。
       こうしないと後ろの列が1つずつずれてしまう。 */
    let plan = "worker";
    const planIdx = cells.findIndex(c => /^(学生|社会人|学|社)$/.test(c.trim()));
    if (planIdx >= 0) {
      plan = /^(学生|学)$/.test(cells[planIdx].trim()) ? "student" : "worker";
      cells = cells.slice(0, planIdx).concat(cells.slice(planIdx + 1));
    }

    // 列が1つだけならお名前とみなす
    let slot = "", name = "", fee = "", phone = "";
    if (cells.length === 1) {
      name = cells[0];
    } else {
      // 1列目が数字だけなら区画番号、そうでなければお名前とみなす
      if (/^\d+$/.test(toHalfWidth(cells[0]))) {
        slot = toHalfWidth(cells[0]);
        name = cells[1] || "";
        fee = cells[2] || "";
        phone = cells[3] || "";
      } else {
        name = cells[0];
        slot = toHalfWidth(cells[1] || "");
        fee = cells[2] || "";
        phone = cells[3] || "";
      }
    }

    name = name.trim();
    if (!name) { errors.push(`${i + 1}行目: お名前が読み取れませんでした`); return; }

    /* 金額の欄に電話番号が入っている場合は電話番号として扱う */
    if (fee && !phone && looksLikePhone(fee)) { phone = fee; fee = ""; }

    const feeNum = toHalfWidth(fee).replace(/[^\d]/g, "");
    rows.push({
      line: i + 1,
      slot,
      name,
      plan,
      fee: feeNum === "" ? "" : Number(feeNum),
      phone: toHalfWidth(phone),
    });
  });

  return { rows, errors };
}

let bulkParsed = null;

function renderBulkPreview() {
  const box = $("#bulkPreview");
  const { rows, errors } = bulkParsed;
  const existingNames = new Set(data.contracts.map(c => c.name));
  const usedSlots = new Set(data.contracts.filter(c => c.active !== false).map(c => String(c.slot)));

  const warn = [];
  rows.forEach(r => {
    if (existingNames.has(r.name)) warn.push(`${r.line}行目: 「${r.name}」さんは既に登録されています`);
    if (r.slot && usedSlots.has(r.slot)) warn.push(`${r.line}行目: 区画 ${r.slot} は既に使われています`);
  });

  box.innerHTML = `
    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
      <div style="font-weight:700;margin-bottom:8px">読み取り結果: ${rows.length}人</div>
      ${rows.length === 0 ? '<div class="empty">読み取れる行がありませんでした。</div>' : ""}
      ${rows.map(r => `
        <div class="row">
          <div class="slot">${escapeHtml(r.slot || "-")}</div>
          <div class="main-col">
            <div class="name">${escapeHtml(r.name)}</div>
            <div class="meta">${escapeHtml(PLAN_LABEL[r.plan])} ・ ${escapeHtml(r.fee === "" ? "標準額 " + yen(data.rates[r.plan]) : yen(r.fee))}${r.phone ? " ・ " + escapeHtml(r.phone) : ""}</div>
          </div>
        </div>`).join("")}
      ${errors.concat(warn).length === 0 ? "" : `
        <div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px">
          ${errors.concat(warn).map(escapeHtml).join("<br>")}
        </div>`}
    </div>`;

  $("#bulkCommit").disabled = rows.length === 0;
}

function openBulk() {
  bulkParsed = null;
  $("#bulkText").value = "";
  $("#bulkPreview").innerHTML = "";
  $("#bulkCommit").disabled = true;
  $("#bulkDlg").showModal();
}

$("#bulkPreviewBtn").addEventListener("click", () => {
  bulkParsed = parseBulk($("#bulkText").value);
  renderBulkPreview();
});

$("#bulkFileBtn").addEventListener("click", () => $("#bulkFile").click());

$("#bulkFile").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    // ExcelのCSVはShift-JISのことが多いので、文字化けしたら読み直す
    let text = new TextDecoder("utf-8").decode(buf);
    if (text.indexOf("�") >= 0) {
      try { text = new TextDecoder("shift_jis").decode(buf); } catch (e) { /* そのまま */ }
    }
    $("#bulkText").value = text;
    bulkParsed = parseBulk(text);
    renderBulkPreview();
  } catch (e) {
    alert("このファイルは読み込めませんでした。");
  } finally {
    ev.target.value = "";
  }
});

$("#bulkCancel").addEventListener("click", () => $("#bulkDlg").close());

$("#bulkCommit").addEventListener("click", () => {
  if (!bulkParsed || bulkParsed.rows.length === 0) return;
  if (!confirm(`${bulkParsed.rows.length}人を追加します。よろしいですか?`)) return;
  bulkParsed.rows.forEach((r, i) => {
    data.contracts.push({
      id: "c" + Date.now().toString(36) + i.toString(36) + Math.random().toString(36).slice(2, 5),
      name: r.name, slot: r.slot, plan: r.plan, fee: r.fee, phone: r.phone,
      start: "", note: "", active: true,
    });
  });
  save();
  $("#bulkDlg").close();
  renderAll();
  alert(`${bulkParsed.rows.length}人を追加しました。`);
});

/* ===== タブ切り替え ===== */
const TAB_TITLES = {
  home: "今月の状況",
  list: "契約者",
  pay: "入金の記録",
  temp: "一時利用",
  sales: "売上",
  settings: "設定",
};

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentTab = btn.dataset.tab;
    /* アプリを開いたまま日付が変わることがある。
       タブを開き直した時点で今日・今月に戻し、
       前日や前月に記録してしまうのを防ぐ。 */
    if (currentTab === "temp") tempDate = todayKey();
    if (currentTab === "pay") viewMonth = monthKey(new Date());
    if (currentTab === "sales") salesYear = new Date().getFullYear();
    document.querySelectorAll("nav.tabs button")
      .forEach(b => b.classList.toggle("active", b === btn));
    renderAll();
    window.scrollTo(0, 0);
  });
});

function renderAll() {
  $("#pageTitle").textContent = TAB_TITLES[currentTab];
  $("#pageSub").textContent = data.siteName || "月極・入金の管理";
  ["home", "list", "pay", "temp", "sales", "settings"].forEach(t => {
    $("#view-" + t).hidden = (t !== currentTab);
  });
  if (currentTab === "home") renderHome();
  else if (currentTab === "list") renderList();
  else if (currentTab === "pay") renderPay();
  else if (currentTab === "temp") renderTemp();
  else if (currentTab === "sales") renderSales();
  else renderSettings();
}

renderAll();

/* ===== オフライン対応の登録 =====
   電波が届かない場所でもアプリが起動するよう、控えを端末に持たせる。
   ファイルを直接開いた場合(file://)は使えないので、その時は何もしない。 */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => {
      console.warn("オフライン対応を登録できませんでした", e);
    });
  });

  /* 新しい版に入れ替わったら、読み込み直すよう促す。
     黙って入れ替えると、画面と中身が食い違うため。 */
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    showUpdateBar();
  });
}

function showUpdateBar() {
  if ($("#updateBar")) return;
  const bar = document.createElement("div");
  bar.id = "updateBar";
  bar.innerHTML = `
    <span>新しい版が届きました</span>
    <button class="btn primary" id="updateNow" style="min-height:38px;padding:0 14px">
      読み込み直す
    </button>`;
  document.body.appendChild(bar);
  $("#updateNow").addEventListener("click", () => location.reload());
}
</script>
