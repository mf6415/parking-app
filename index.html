<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="駐輪場管理">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>駐輪場管理</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f4;
    --text: #1a1d21;
    --text-dim: #626b76;
    --border: #d7dbe2;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --ok: #17803d;
    --ok-bg: #e4f5ea;
    --warn: #b42318;
    --warn-bg: #fdeceb;
    --radius: 14px;
    --tap: 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a;
      --surface: #1d2126;
      --surface-2: #262b31;
      --text: #e9ecef;
      --text-dim: #9aa4b0;
      --border: #333a42;
      --accent: #4c8dff;
      --accent-text: #0b0d10;
      --ok: #5ddb90;
      --ok-bg: #16301f;
      --warn: #ff8d85;
      --warn-bg: #351a18;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a;
    --surface: #1d2126;
    --surface-2: #262b31;
    --text: #e9ecef;
    --text-dim: #9aa4b0;
    --border: #333a42;
    --accent: #4c8dff;
    --accent-text: #0b0d10;
    --ok: #5ddb90;
    --ok-bg: #16301f;
    --warn: #ff8d85;
    --warn-bg: #351a18;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                 "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }

  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .02em; }
  header .sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

  main { max-width: 820px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 12px; font-size: 15px; font-weight: 700;
    color: var(--text-dim); letter-spacing: .06em;
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat {
    background: var(--surface-2); border-radius: 10px;
    padding: 12px 10px; text-align: center;
  }
  .stat .label { font-size: 12px; color: var(--text-dim); }
  .stat .value {
    font-size: 22px; font-weight: 700; margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .stat.warn .value { color: var(--warn); }
  .stat.ok .value { color: var(--ok); }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 4px; border-bottom: 1px solid var(--border);
    min-height: var(--tap);
  }
  .row:last-child { border-bottom: none; }
  .row .main-col { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; }
  .row .meta {
    font-size: 13px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slot {
    flex-shrink: 0; width: 52px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); border-radius: 8px;
    font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
  }

  .pill {
    flex-shrink: 0; border: none; cursor: pointer;
    min-height: 40px; padding: 0 14px; border-radius: 999px;
    font-size: 14px; font-weight: 700; font-family: inherit;
  }
  .pill.paid { background: var(--ok-bg); color: var(--ok); }
  .pill.unpaid { background: var(--warn-bg); color: var(--warn); }

  button, input, select, textarea { font-family: inherit; font-size: 16px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; min-height: var(--tap); padding: 0 18px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .btn.danger { color: var(--warn); border-color: var(--warn); background: transparent; }
  .btn.block { width: 100%; }
  .btn:active { opacity: .7; }

  label.field { display: block; margin-bottom: 14px; }
  label.field .lab {
    display: block; font-size: 13px; color: var(--text-dim);
    margin-bottom: 5px; font-weight: 600;
  }
  label.field input, label.field select, label.field textarea {
    width: 100%; min-height: var(--tap);
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg); color: var(--text);
  }
  label.field textarea { min-height: 76px; resize: vertical; }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    flex: 1; border: none; background: none; cursor: pointer;
    padding: 10px 4px 12px; color: var(--text-dim);
    font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.tabs button.active { color: var(--accent); }
  nav.tabs button svg { width: 24px; height: 24px; }

  dialog {
    border: none; border-radius: 16px; padding: 0;
    background: var(--surface); color: var(--text);
    width: min(520px, calc(100vw - 32px)); max-height: 88vh;
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg-head {
    padding: 16px; border-bottom: 1px solid var(--border);
    font-weight: 700; position: sticky; top: 0; background: var(--surface);
  }
  .dlg-body { padding: 16px; overflow-y: auto; }
  .dlg-foot {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    display: flex; gap: 10px; position: sticky; bottom: 0; background: var(--surface);
  }
  .dlg-foot .btn { flex: 1; }

  .empty { text-align: center; color: var(--text-dim); padding: 28px 12px; font-size: 14px; }

  .month-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .month-bar .btn { min-width: 52px; padding: 0 10px; }
  .month-bar .m {
    flex: 1; text-align: center; font-weight: 700; font-size: 17px;
    font-variant-numeric: tabular-nums;
  }

  .hint { font-size: 13px; color: var(--text-dim); margin: 6px 0 0; }
  .inactive { opacity: .48; }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">今月の状況</h1>
  <div class="sub" id="pageSub"></div>
</header>

<main>
  <section id="view-home"></section>
  <section id="view-list" hidden></section>
  <section id="view-pay" hidden></section>
  <section id="view-settings" hidden></section>
</main>

<nav class="tabs">
  <button data-tab="home" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    ホーム
  </button>
  <button data-tab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    契約者
  </button>
  <button data-tab="pay">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg>
    入金
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    設定
  </button>
</nav>

<!-- 契約者の追加・編集ダイアログ -->
<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <div class="dlg-head" id="editTitle">契約者を追加</div>
    <div class="dlg-body">
      <label class="field">
        <span class="lab">お名前 <span style="color:var(--warn)">*</span></span>
        <input name="name" required placeholder="例: 山田 太郎">
      </label>
      <label class="field">
        <span class="lab">区画番号</span>
        <input name="slot" inputmode="numeric" placeholder="例: 12">
      </label>
      <label class="field">
        <span class="lab">月額料金(円)</span>
        <input name="fee" type="number" inputmode="numeric" min="0" step="100" placeholder="例: 1500">
      </label>
      <label class="field">
        <span class="lab">電話番号</span>
        <input name="phone" type="tel" inputmode="tel" placeholder="例: 090-1234-5678">
      </label>
      <label class="field">
        <span class="lab">契約開始日</span>
        <input name="start" type="date">
      </label>
      <label class="field">
        <span class="lab">車種・メモ</span>
        <textarea name="note" placeholder="例: 電動アシスト、青色"></textarea>
      </label>
      <label class="field">
        <span class="lab">契約状態</span>
        <select name="active">
          <option value="1">契約中</option>
          <option value="0">解約済み</option>
        </select>
      </label>
      <button type="button" class="btn danger block" id="deleteBtn" hidden>この契約者を削除</button>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="cancelBtn">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<!-- まとめて追加ダイアログ -->
<dialog id="bulkDlg">
  <div class="dlg-head">契約者をまとめて追加</div>
  <div class="dlg-body">
    <p class="hint" style="margin:0 0 12px">
      1行に1人ずつ、<b>区画番号, お名前, 月額, 電話番号</b> の順に入力します。
      お名前だけでも構いません。Excelからコピーしたものをそのまま貼り付けられます。
    </p>
    <label class="field">
      <span class="lab">貼り付け欄</span>
      <textarea id="bulkText" style="min-height:150px" placeholder="1, 山田 太郎, 1500, 090-1234-5678
2, 鈴木 花子, 1500
3, 佐藤 次郎"></textarea>
    </label>
    <button class="btn block" id="bulkFileBtn" style="margin-bottom:12px">CSVファイルを選ぶ</button>
    <input type="file" id="bulkFile" accept=".csv,.txt,text/csv,text/plain" hidden>
    <button class="btn primary block" id="bulkPreviewBtn">内容を確認する</button>
    <div id="bulkPreview"></div>
  </div>
  <div class="dlg-foot">
    <button type="button" class="btn" id="bulkCancel">キャンセル</button>
    <button type="button" class="btn primary" id="bulkCommit" disabled>追加する</button>
  </div>
</dialog>

<script>
"use strict";

/* ===== データの保存先 =====
   iPad/iPhone本体のブラウザ内(localStorage)に保存します。
   外部サーバーには一切送信されません。
   端末を変えるとデータは移らないので、設定タブのバックアップを使ってください。 */
const STORE_KEY = "parking.v1";

/* siteName(駐輪場の名前)は、この端末の中だけに保存されます。
   場所が特定されないよう、プログラム側には一切書き込みません。 */
function freshData() { return { contracts: [], payments: {}, defaultFee: 1500, siteName: "" }; }

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return freshData();
    const parsed = JSON.parse(raw);
    return {
      contracts: Array.isArray(parsed.contracts) ? parsed.contracts : [],
      payments: (parsed.payments && typeof parsed.payments === "object") ? parsed.payments : {},
      defaultFee: Number.isFinite(parsed.defaultFee) ? parsed.defaultFee : 1500,
      siteName: typeof parsed.siteName === "string" ? parsed.siteName : "",
    };
  } catch (e) {
    console.warn("保存データを読めませんでした", e);
    return freshData();
  }
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch (e) {
    alert("保存に失敗しました。ブラウザのプライベートモードを解除してお試しください。");
  }
}

let data = load();

/* ===== 便利関数 ===== */
const yen = n => "¥" + (Number(n) || 0).toLocaleString("ja-JP");
const $ = sel => document.querySelector(sel);

function monthKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function monthLabel(key) {
  const [y, m] = key.split("-");
  return `${y}年 ${Number(m)}月`;
}
function shiftMonth(key, delta) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKey(d);
}
function payKey(contractId, mKey) { return contractId + "@" + mKey; }
function isPaid(contractId, mKey) { return Boolean(data.payments[payKey(contractId, mKey)]); }

function activeContracts() {
  return data.contracts
    .filter(c => c.active !== false)
    .sort((a, b) => (Number(a.slot) || 9999) - (Number(b.slot) || 9999));
}

function feeOf(c) {
  return Number.isFinite(Number(c.fee)) && c.fee !== "" ? Number(c.fee) : data.defaultFee;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

/* ===== 画面の状態 ===== */
let currentTab = "home";
let viewMonth = monthKey(new Date());

/* ===== ホーム画面 ===== */
function renderHome() {
  const list = activeContracts();
  const thisMonth = monthKey(new Date());
  const unpaid = list.filter(c => !isPaid(c.id, thisMonth));
  const paidTotal = list.filter(c => isPaid(c.id, thisMonth))
                        .reduce((s, c) => s + feeOf(c), 0);
  const unpaidTotal = unpaid.reduce((s, c) => s + feeOf(c), 0);

  $("#view-home").innerHTML = `
    <div class="card">
      <h2>${escapeHtml(monthLabel(thisMonth))}</h2>
      <div class="stats">
        <div class="stat">
          <div class="label">契約数</div>
          <div class="value">${list.length}</div>
        </div>
        <div class="stat ok">
          <div class="label">入金済み</div>
          <div class="value">${escapeHtml(yen(paidTotal))}</div>
        </div>
        <div class="stat warn">
          <div class="label">未入金</div>
          <div class="value">${escapeHtml(yen(unpaidTotal))}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>今月まだ入金のない方 (${unpaid.length}件)</h2>
      ${unpaid.length === 0
        ? `<div class="empty">${list.length === 0
              ? "契約者がまだ登録されていません。<br>「契約者」タブから追加してください。"
              : "全員入金済みです。"}</div>`
        : unpaid.map(c => `
          <div class="row">
            <div class="slot">${escapeHtml(c.slot || "-")}</div>
            <div class="main-col">
              <div class="name">${escapeHtml(c.name)}</div>
              <div class="meta">${escapeHtml(yen(feeOf(c)))}${c.phone ? " ・ " + escapeHtml(c.phone) : ""}</div>
            </div>
            <button class="pill unpaid" data-pay="${escapeHtml(c.id)}">受け取る</button>
          </div>`).join("")}
    </div>`;

  $("#view-home").querySelectorAll("[data-pay]").forEach(btn => {
    btn.addEventListener("click", () => {
      togglePay(btn.dataset.pay, thisMonth);
      renderAll();
    });
  });
}

/* ===== 契約者一覧 ===== */
function renderList() {
  const list = [...data.contracts].sort((a, b) => {
    if ((a.active !== false) !== (b.active !== false)) return a.active === false ? 1 : -1;
    return (Number(a.slot) || 9999) - (Number(b.slot) || 9999);
  });

  $("#view-list").innerHTML = `
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <button class="btn primary" id="addBtn" style="flex:1">＋ 1人ずつ追加</button>
      <button class="btn" id="bulkBtn" style="flex:1">まとめて追加</button>
    </div>
    <div class="card">
      <h2>登録済み (${data.contracts.filter(c => c.active !== false).length}件が契約中)</h2>
      ${list.length === 0
        ? `<div class="empty">まだ誰も登録されていません。</div>`
        : list.map(c => `
          <div class="row ${c.active === false ? "inactive" : ""}" data-edit="${escapeHtml(c.id)}"
               style="cursor:pointer">
            <div class="slot">${escapeHtml(c.slot || "-")}</div>
            <div class="main-col">
              <div class="name">${escapeHtml(c.name)}${c.active === false ? "(解約)" : ""}</div>
              <div class="meta">${escapeHtml(yen(feeOf(c)))}${c.note ? " ・ " + escapeHtml(c.note) : ""}</div>
            </div>
            <div style="color:var(--text-dim)">›</div>
          </div>`).join("")}
    </div>`;

  $("#addBtn").addEventListener("click", () => openEdit(null));
  $("#bulkBtn").addEventListener("click", () => openBulk());
  $("#view-list").querySelectorAll("[data-edit]").forEach(row => {
    row.addEventListener("click", () => openEdit(row.dataset.edit));
  });
}

/* ===== 入金管理 ===== */
function renderPay() {
  const list = activeContracts();
  const paid = list.filter(c => isPaid(c.id, viewMonth));
  const total = paid.reduce((s, c) => s + feeOf(c), 0);

  $("#view-pay").innerHTML = `
    <div class="month-bar">
      <button class="btn" id="prevM">‹</button>
      <div class="m">${escapeHtml(monthLabel(viewMonth))}</div>
      <button class="btn" id="nextM">›</button>
    </div>

    <div class="card">
      <h2>この月の集計</h2>
      <div class="stats">
        <div class="stat"><div class="label">対象</div><div class="value">${list.length}</div></div>
        <div class="stat ok"><div class="label">入金済み</div><div class="value">${paid.length}</div></div>
        <div class="stat"><div class="label">合計額</div><div class="value">${escapeHtml(yen(total))}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>名前をタップで入金を記録</h2>
      ${list.length === 0
        ? `<div class="empty">契約中の方がいません。</div>`
        : list.map(c => {
            const p = isPaid(c.id, viewMonth);
            return `
            <div class="row">
              <div class="slot">${escapeHtml(c.slot || "-")}</div>
              <div class="main-col">
                <div class="name">${escapeHtml(c.name)}</div>
                <div class="meta">${escapeHtml(yen(feeOf(c)))}</div>
              </div>
              <button class="pill ${p ? "paid" : "unpaid"}" data-toggle="${escapeHtml(c.id)}">
                ${p ? "入金済み" : "未入金"}
              </button>
            </div>`;
          }).join("")}
    </div>`;

  $("#prevM").addEventListener("click", () => { viewMonth = shiftMonth(viewMonth, -1); renderPay(); });
  $("#nextM").addEventListener("click", () => { viewMonth = shiftMonth(viewMonth, 1); renderPay(); });
  $("#view-pay").querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      togglePay(btn.dataset.toggle, viewMonth);
      renderAll();
    });
  });
}

function togglePay(contractId, mKey) {
  const k = payKey(contractId, mKey);
  if (data.payments[k]) {
    delete data.payments[k];
  } else {
    const c = data.contracts.find(x => x.id === contractId);
    data.payments[k] = { at: new Date().toISOString(), amount: c ? feeOf(c) : 0 };
  }
  save();
}

/* ===== 設定・バックアップ ===== */
function renderSettings() {
  $("#view-settings").innerHTML = `
    <div class="card">
      <h2>駐輪場の名前</h2>
      <label class="field">
        <span class="lab">画面の上に表示されます。空欄でも構いません</span>
        <input type="text" id="siteName" maxlength="30" value="${escapeHtml(data.siteName)}">
      </label>
      <button class="btn primary block" id="saveName">保存する</button>
      <p class="hint">
        ここに入れた名前はこの端末の中だけに保存され、インターネット上には出ません。
      </p>
    </div>

    <div class="card">
      <h2>標準の月額料金</h2>
      <label class="field">
        <span class="lab">契約者ごとに料金を入れない場合、この金額が使われます</span>
        <input type="number" id="defFee" min="0" step="100" value="${escapeHtml(data.defaultFee)}">
      </label>
      <button class="btn primary block" id="saveFee">保存する</button>
    </div>

    <div class="card">
      <h2>バックアップ</h2>
      <p class="hint" style="margin-bottom:12px">
        データはこの端末の中だけに保存されています。端末の買い替えや故障に備えて、
        ときどきバックアップを書き出して、メールやファイルアプリに残しておいてください。
      </p>
      <button class="btn block" id="exportBtn" style="margin-bottom:10px">バックアップを書き出す</button>
      <button class="btn block" id="importBtn">バックアップから復元する</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>

    <div class="card">
      <h2>この端末のデータ</h2>
      <p class="hint">
        契約者 ${data.contracts.length}件 / 入金記録 ${Object.keys(data.payments).length}件
      </p>
    </div>`;

  $("#saveName").addEventListener("click", () => {
    data.siteName = $("#siteName").value.trim();
    save(); renderAll();
    alert("保存しました。");
  });

  $("#saveFee").addEventListener("click", () => {
    const v = Number($("#defFee").value);
    if (!Number.isFinite(v) || v < 0) { alert("正しい金額を入力してください。"); return; }
    data.defaultFee = v; save(); renderAll();
    alert("保存しました。");
  });

  $("#exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `駐輪場バックアップ_${monthKey(new Date())}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  $("#importBtn").addEventListener("click", () => $("#importFile").click());
  $("#importFile").addEventListener("change", async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (!Array.isArray(parsed.contracts)) throw new Error("形式が違います");
      if (!confirm("今このアプリに入っているデータは上書きされます。復元しますか?")) return;
      data = {
        contracts: parsed.contracts,
        payments: parsed.payments || {},
        defaultFee: Number.isFinite(parsed.defaultFee) ? parsed.defaultFee : 1500,
        siteName: typeof parsed.siteName === "string" ? parsed.siteName : "",
      };
      save(); renderAll();
      alert("復元しました。");
    } catch (e) {
      alert("このファイルは読み込めませんでした。");
    } finally {
      ev.target.value = "";
    }
  });
}

/* ===== 追加・編集ダイアログ ===== */
let editingId = null;

function openEdit(id) {
  editingId = id;
  const form = $("#editForm");
  const c = id ? data.contracts.find(x => x.id === id) : null;

  $("#editTitle").textContent = c ? "契約者を編集" : "契約者を追加";
  form.name.value = c ? (c.name || "") : "";
  form.slot.value = c ? (c.slot || "") : "";
  form.fee.value = c && c.fee !== "" && c.fee != null ? c.fee : "";
  form.phone.value = c ? (c.phone || "") : "";
  form.start.value = c ? (c.start || "") : "";
  form.note.value = c ? (c.note || "") : "";
  form.active.value = c && c.active === false ? "0" : "1";
  $("#deleteBtn").hidden = !c;

  $("#editDlg").showModal();
}

$("#editForm").addEventListener("submit", (ev) => {
  const form = ev.target;
  const rec = {
    id: editingId || ("c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
    name: form.name.value.trim(),
    slot: form.slot.value.trim(),
    fee: form.fee.value === "" ? "" : Number(form.fee.value),
    phone: form.phone.value.trim(),
    start: form.start.value,
    note: form.note.value.trim(),
    active: form.active.value === "1",
  };
  if (!rec.name) { ev.preventDefault(); alert("お名前を入力してください。"); return; }

  const idx = data.contracts.findIndex(x => x.id === rec.id);
  if (idx >= 0) data.contracts[idx] = rec; else data.contracts.push(rec);
  save();
  setTimeout(renderAll, 0);
});

$("#cancelBtn").addEventListener("click", () => $("#editDlg").close());

$("#deleteBtn").addEventListener("click", () => {
  if (!editingId) return;
  const c = data.contracts.find(x => x.id === editingId);
  if (!confirm(`「${c ? c.name : ""}」さんを削除します。\n入金の記録も消えます。よろしいですか?`)) return;
  data.contracts = data.contracts.filter(x => x.id !== editingId);
  Object.keys(data.payments).forEach(k => {
    if (k.startsWith(editingId + "@")) delete data.payments[k];
  });
  save();
  $("#editDlg").close();
  renderAll();
});

/* ===== まとめて追加 ===== */

/* 1行を項目に分割する。タブ区切り(Excelからの貼り付け)と
   カンマ区切り(CSV)の両方に対応し、"..." で囲まれた項目も扱う。 */
function splitLine(line) {
  // 区切り文字を判定する。全角カンマ(，)で入力されることもある。
  let sep = ",";
  if (line.indexOf("\t") >= 0) sep = "\t";
  else if (line.indexOf(",") >= 0) sep = ",";
  else if (line.indexOf("，") >= 0) sep = "，";
  const out = [];
  let cur = "", inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuote) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuote = false;
      } else cur += ch;
    } else if (ch === '"') {
      inQuote = true;
    } else if (ch === sep) {
      out.push(cur); cur = "";
    } else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

/* 全角の数字や記号を半角に直す(手入力のゆらぎ対策) */
function toHalfWidth(s) {
  return String(s)
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[－ー−]/g, "-")
    .replace(/[，]/g, ",")
    .replace(/\s+/g, " ")
    .trim();
}

function parseBulk(text) {
  const rows = [];
  const errors = [];
  const lines = text.split(/\r?\n/);

  lines.forEach((line, i) => {
    if (!line.trim()) return;
    let cells = splitLine(line);

    // 見出し行(1行目に「名前」「氏名」などが入っている)は読み飛ばす
    if (i === 0 && cells.some(c => /名前|氏名|区画|番号|月額|料金|電話/.test(c))) return;

    // 列が1つだけならお名前とみなす
    let slot = "", name = "", fee = "", phone = "";
    if (cells.length === 1) {
      name = cells[0];
    } else {
      // 1列目が数字だけなら区画番号、そうでなければお名前とみなす
      if (/^\d+$/.test(toHalfWidth(cells[0]))) {
        slot = toHalfWidth(cells[0]);
        name = cells[1] || "";
        fee = cells[2] || "";
        phone = cells[3] || "";
      } else {
        name = cells[0];
        slot = toHalfWidth(cells[1] || "");
        fee = cells[2] || "";
        phone = cells[3] || "";
      }
    }

    name = name.trim();
    if (!name) { errors.push(`${i + 1}行目: お名前が読み取れませんでした`); return; }

    const feeNum = toHalfWidth(fee).replace(/[^\d]/g, "");
    rows.push({
      line: i + 1,
      slot,
      name,
      fee: feeNum === "" ? "" : Number(feeNum),
      phone: toHalfWidth(phone),
    });
  });

  return { rows, errors };
}

let bulkParsed = null;

function renderBulkPreview() {
  const box = $("#bulkPreview");
  const { rows, errors } = bulkParsed;
  const existingNames = new Set(data.contracts.map(c => c.name));
  const usedSlots = new Set(data.contracts.filter(c => c.active !== false).map(c => String(c.slot)));

  const warn = [];
  rows.forEach(r => {
    if (existingNames.has(r.name)) warn.push(`${r.line}行目: 「${r.name}」さんは既に登録されています`);
    if (r.slot && usedSlots.has(r.slot)) warn.push(`${r.line}行目: 区画 ${r.slot} は既に使われています`);
  });

  box.innerHTML = `
    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
      <div style="font-weight:700;margin-bottom:8px">読み取り結果: ${rows.length}人</div>
      ${rows.length === 0 ? '<div class="empty">読み取れる行がありませんでした。</div>' : ""}
      ${rows.map(r => `
        <div class="row">
          <div class="slot">${escapeHtml(r.slot || "-")}</div>
          <div class="main-col">
            <div class="name">${escapeHtml(r.name)}</div>
            <div class="meta">${escapeHtml(r.fee === "" ? "標準額 " + yen(data.defaultFee) : yen(r.fee))}${r.phone ? " ・ " + escapeHtml(r.phone) : ""}</div>
          </div>
        </div>`).join("")}
      ${errors.concat(warn).length === 0 ? "" : `
        <div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px">
          ${errors.concat(warn).map(escapeHtml).join("<br>")}
        </div>`}
    </div>`;

  $("#bulkCommit").disabled = rows.length === 0;
}

function openBulk() {
  bulkParsed = null;
  $("#bulkText").value = "";
  $("#bulkPreview").innerHTML = "";
  $("#bulkCommit").disabled = true;
  $("#bulkDlg").showModal();
}

$("#bulkPreviewBtn").addEventListener("click", () => {
  bulkParsed = parseBulk($("#bulkText").value);
  renderBulkPreview();
});

$("#bulkFileBtn").addEventListener("click", () => $("#bulkFile").click());

$("#bulkFile").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    // ExcelのCSVはShift-JISのことが多いので、文字化けしたら読み直す
    let text = new TextDecoder("utf-8").decode(buf);
    if (text.indexOf("�") >= 0) {
      try { text = new TextDecoder("shift_jis").decode(buf); } catch (e) { /* そのまま */ }
    }
    $("#bulkText").value = text;
    bulkParsed = parseBulk(text);
    renderBulkPreview();
  } catch (e) {
    alert("このファイルは読み込めませんでした。");
  } finally {
    ev.target.value = "";
  }
});

$("#bulkCancel").addEventListener("click", () => $("#bulkDlg").close());

$("#bulkCommit").addEventListener("click", () => {
  if (!bulkParsed || bulkParsed.rows.length === 0) return;
  if (!confirm(`${bulkParsed.rows.length}人を追加します。よろしいですか?`)) return;
  bulkParsed.rows.forEach((r, i) => {
    data.contracts.push({
      id: "c" + Date.now().toString(36) + i.toString(36) + Math.random().toString(36).slice(2, 5),
      name: r.name, slot: r.slot, fee: r.fee, phone: r.phone,
      start: "", note: "", active: true,
    });
  });
  save();
  $("#bulkDlg").close();
  renderAll();
  alert(`${bulkParsed.rows.length}人を追加しました。`);
});

/* ===== タブ切り替え ===== */
const TAB_TITLES = {
  home: "今月の状況",
  list: "契約者",
  pay: "入金の記録",
  settings: "設定",
};

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentTab = btn.dataset.tab;
    document.querySelectorAll("nav.tabs button")
      .forEach(b => b.classList.toggle("active", b === btn));
    renderAll();
    window.scrollTo(0, 0);
  });
});

function renderAll() {
  $("#pageTitle").textContent = TAB_TITLES[currentTab];
  $("#pageSub").textContent = data.siteName || "月極・入金の管理";
  ["home", "list", "pay", "settings"].forEach(t => {
    $("#view-" + t).hidden = (t !== currentTab);
  });
  if (currentTab === "home") renderHome();
  else if (currentTab === "list") renderList();
  else if (currentTab === "pay") renderPay();
  else renderSettings();
}

renderAll();
